<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="28" fill="url(#darkGrad)" stroke="url(#grad)" stroke-width="4"/>
  <!-- Neural dots -->
  <circle cx="28" cy="28" r="3" fill="#06b6d4" />
  <circle cx="72" cy="28" r="3" fill="#8b5cf6" />
  <circle cx="28" cy="72" r="3" fill="#3b82f6" />
  <circle cx="72" cy="72" r="3" fill="#06b6d4" />
  <!-- Monogram text RH -->
  <text x="50" y="63" font-family="'Inter', sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="url(#grad)" letter-spacing="-1">RH</text>
</svg>
